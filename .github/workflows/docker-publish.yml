name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Additional tag (e.g. v1.0). Leave blank to skip."
        required: false
        default: "v1.0"

env:
  IMAGE_NAME: rhysho/worker-rmbg2_0

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The final image is ~9 GB and intermediate build layers push the
      # GitHub-hosted runner well past its default free disk. Strip the
      # large pre-installed toolchains we don't need for Docker builds.
      - name: Free runner disk space
        run: |
          set -e
          echo "::group::Before"
          df -h /
          echo "::endgroup::"
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Java_* \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/PyPy
          sudo apt-get clean
          docker image prune --all --force >/dev/null
          echo "::group::After"
          df -h /
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Compute tags from the trigger:
      #  - push to main           → :latest, :main-<short-sha>, :v1.0 (rolling)
      #  - tag push v*            → :latest, :<tag>
      #  - workflow_dispatch      → :latest, :<version_tag input> (default v1.0)
      - name: Compute tags
        id: tags
        run: |
          TAGS="${IMAGE_NAME}:latest"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${IMAGE_NAME}:${VERSION}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version_tag }}" ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:${{ inputs.version_tag }}"
          else
            # branch push to main → keep a rolling :v1.0 plus a sha-pinned tag
            TAGS="${TAGS},${IMAGE_NAME}:v1.0,${IMAGE_NAME}:main-${SHORT_SHA}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved tags:"
          echo "${TAGS}" | tr ',' '\n' | sed 's/^/  /'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image digest
        run: |
          echo "Pushed tags:"
          echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/  /'
